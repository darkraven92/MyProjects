<!DOCTYPE html>
<html>
<head>
<title>Pokemon Yellow - Live View</title>
<style>
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  img { image-rendering: pixelated; width: 480px; height: 432px; }
  p { color: #888; font-family: monospace; margin-top: 10px; }
</style>
</head>
<body>
<img id="screen" src="screenshots/frame.png">
<p id="ts"></p>
<script>
function reload() {
  var img = document.getElementById('screen');
  img.src = 'screenshots/frame.png?' + Date.now();
  document.getElementById('ts').textContent = new Date().toLocaleTimeString();
  setTimeout(reload, 100); // refresh 10x per second
}
reload();
</script>
</body>
</html>
